# 規約 §8.3 の「ローカルと CI で同じものを実行する」。
# ここで走るのは `npm run check` と `npm run verify:rules` の2本だけで、
# どちらも手元で叩くコマンドと同一。CI 専用の手順を足さない。
name: check

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # package.json の engines は >=24.12.0（型注釈除去が stable な版）
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # lint / format 検査 / typecheck / test
      - run: npm run check

      # 規約 §8.1 の各要求が実際に効いているかを確かめる
      # （警告ゼロで通ることは「守られている」の証拠にならない）
      - run: npm run verify:rules
